<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search · Home Videos</title>
    <script type="module" src="/src/pages/search.ts"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"><span class="brand">Home Videos</span></header>
    <main id="main">
      <h1>Find a video</h1>
      <form id="search-form" class="toolbar" role="search">
        <input
          id="q"
          type="search"
          name="q"
          placeholder="Search titles and channels…"
          aria-label="Search"
        />
        <select id="area" aria-label="Area"></select>
        <button type="submit" class="primary">Search</button>
      </form>
      <div id="tag-filter" class="chips" aria-label="Filter by tag"></div>
      <p id="count" class="muted"></p>
      <div id="results" class="grid"></div>
      <div class="pager"><button id="more" type="button" hidden>Show more</button></div>
    </main>
    <div id="status" role="status" aria-live="polite"></div>
  </body>
</html>
